name: Release

# Publishes one plugin, two ways.
#
# Normally: Actions tab -> Release -> "Run workflow" -> pick the plugin. The
# version is read from that plugin's Version: header, so the tag can never
# disagree with the code, and the tag is created for you.
#
# Or by tag, if you prefer the command line:
#   git tag scout-core-v1.0.2 && git push origin scout-core-v1.0.2
#
# Either way it builds <slug>.zip and attaches it to a GitHub release. Sites
# running that plugin pick the update up within a few hours.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Which plugin to release (version comes from its header)
        required: true
        type: choice
        options:
          - scout-core
          - scout-forms-guard
          - scout-optimize
          - scout-rvpark
  push:
    tags:
      - 'scout-*-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out which plugin, which version, which tag
        id: target
        run: |
          set -euo pipefail

          # No `head` here on purpose: under `set -o pipefail` an early-closing
          # pipe can fail the step. A plugin header carries exactly one
          # Version: line, so this needs no truncation.
          header_version() {
            sed -n 's/^ \* Version: *//p' "$1/$1.php" | tr -d '[:space:]'
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slug="${{ inputs.plugin }}"
            if [ ! -f "${slug}/${slug}.php" ]; then
              echo "::error::No such plugin: ${slug}/${slug}.php not found."
              exit 1
            fi
            version="$(header_version "${slug}")"
            if [ -z "${version}" ]; then
              echo "::error::${slug}.php has no readable Version: header."
              exit 1
            fi
            tag="${slug}-v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            slug="${tag%-v*}"
            version="${tag##*-v}"
            if [ ! -f "${slug}/${slug}.php" ]; then
              echo "::error::Tag '${tag}' does not match a plugin: ${slug}/${slug}.php not found."
              exit 1
            fi
            header="$(header_version "${slug}")"
            if [ "${header}" != "${version}" ]; then
              echo "::error::${slug}.php says Version ${header}, tag says ${version}. Bump the header first."
              exit 1
            fi
          fi

          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${slug} ${version} as ${tag}"

      - name: Refuse to re-release a version that already shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.target.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists. Bump the version and try again; never re-tag a shipped version."
            exit 1
          fi

      - name: PHP syntax check
        run: find "${{ steps.target.outputs.slug }}" -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        run: |
          slug="${{ steps.target.outputs.slug }}"
          # Zip the plugin folder itself so it unpacks to wp-content/plugins/<slug>/.
          zip -r "${slug}.zip" "${slug}" -x '*.DS_Store' -x '*/.git/*' >/dev/null
          unzip -l "${slug}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="${{ steps.target.outputs.slug }}"
          version="${{ steps.target.outputs.version }}"
          tag="${{ steps.target.outputs.tag }}"

          notes="$(sed -n "/^## \[\?${version}\]\?/,/^## /p" "${slug}/CHANGELOG.md" 2>/dev/null | sed '$d')"
          if [ -z "${notes}" ]; then
            notes="See ${slug}/CHANGELOG.md."
          fi

          # --target creates the tag at this commit when it does not exist yet,
          # which is what makes the dropdown run work without a pushed tag.
          gh release create "${tag}" "${slug}.zip" \
            --target "${GITHUB_SHA}" \
            --title "${slug} ${version}" \
            --notes "${notes}"

          echo "Published ${tag}"
