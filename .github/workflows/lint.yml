name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # Each plugin is linted only on the PHP versions it supports, read from
      # its own "Requires PHP:" header (scout-optimize needs 8.1, for example).
      - name: Lint every PHP file
        run: |
          set -euo pipefail
          current="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          for dir in */; do
            slug="${dir%/}"
            main="${slug}/${slug}.php"
            if [ -f "$main" ]; then
              needs="$(sed -n 's/^ \* Requires PHP: *//p' "$main" | tr -d '[:space:]')"
              if [ -n "$needs" ] && php -r "exit(version_compare('$current', '$needs', '<') ? 0 : 1);"; then
                echo "Skipping ${slug}: requires PHP ${needs}, this job runs ${current}."
                continue
              fi
            fi
            find "$dir" -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 -P4 php -l
          done
